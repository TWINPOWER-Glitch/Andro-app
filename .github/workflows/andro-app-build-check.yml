name: Andro Android CI, APK Tests and Releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - "gradle/**"
      - "buildSrc/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/andro-app-build-check.yml"

  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "buildSrc/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/andro-app-build-check.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andro-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 50

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=andro-apks-v$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Andro version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="v${{ steps.version.outputs.version_name }}"
          ACTUAL="${GITHUB_REF_NAME}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Tag $ACTUAL does not match app version $EXPECTED"
            exit 1
          fi

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Validate APK outputs
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$DEBUG_APK" > debug-badging.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$RELEASE_APK" > release-badging.txt

          head -n 5 debug-badging.txt
          head -n 5 release-badging.txt

          echo "Both APK archives passed validation."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  apk-smoke-test:
    name: Install, Launch and Inspect Andro UI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: apks

      - name: Locate debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find apks -name "app-debug.apk" -print -quit)

          test -n "$APK"
          test -s "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Using APK: $APK"

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

          ls -l /dev/kvm

          echo "KVM hardware acceleration configured."

      - name: Restore Android Virtual Device cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: andro-avd-${{ runner.os }}-api35-google-apis-x86_64-pixel2-v2

      - name: Prepare emulator smoke-test script
        shell: bash
        run: |
          set -euo pipefail

          cat > smoke-test.sh <<'SMOKE_TEST'
          #!/bin/sh

          set -eu

          APK_PATH="${1:?Debug APK path was not supplied}"

          if [ ! -s "$APK_PATH" ]; then
            echo "Debug APK does not exist: $APK_PATH"
            exit 1
          fi

          echo "Installing Andro debug APK..."

          adb install -r "$APK_PATH"

          echo "Launching Andro authentication activity..."

          adb shell am force-stop com.twinpower.andro || true

          adb shell am start -W \
            -n com.twinpower.andro/.AuthGateActivity

          echo "Allowing the authentication screen to initialize..."

          sleep 8

          echo "Checking Andro application process..."

          PID="$(adb shell pidof com.twinpower.andro | tr -d '\r\n')"

          if [ -z "$PID" ]; then
            echo "Andro application process is not running."
            exit 1
          fi

          echo "Andro process is running: $PID"

          echo "Checking foreground activity..."

          adb shell dumpsys activity activities \
            > /tmp/andro-activities.txt

          if ! grep -F 'AuthGateActivity' /tmp/andro-activities.txt; then
            echo "AuthGateActivity was not found in activity diagnostics."
            exit 1
          fi

          echo "Correct launcher activity verified."

          echo "Inspecting unauthenticated sign-in screen..."

          adb shell uiautomator dump \
            /sdcard/andro-auth-screen.xml

          adb pull /sdcard/andro-auth-screen.xml \
            /tmp/andro-auth-screen.xml

          UI="/tmp/andro-auth-screen.xml"

          if ! grep -F 'ANDRO' "$UI"; then
            echo "Andro application title was not found."
            exit 1
          fi

          if ! grep -F 'CUSTOMER ACCOUNT' "$UI"; then
            echo "Customer account section was not found."
            exit 1
          fi

          if ! grep -F 'Your Android development environment' "$UI"; then
            echo "Andro application description was not found."
            exit 1
          fi

          if ! grep -F 'Continue with GitHub' "$UI"; then
            echo "GitHub sign-in button was not found."
            exit 1
          fi

          if ! grep -F 'Your GitHub account authenticates you to Andro' "$UI"; then
            echo "Account security explanation was not found."
            exit 1
          fi

          echo "Unauthenticated Andro sign-in screen verified."

          echo "The test will not press the GitHub sign-in button."

          echo "Removing test installation..."

          adb shell am force-stop com.twinpower.andro
          adb uninstall com.twinpower.andro

          echo "Andro installation, launcher and authentication UI tests passed."
          SMOKE_TEST

          chmod +x smoke-test.sh

          test -s smoke-test.sh

          echo "Smoke-test script prepared."

      - name: Install, launch and inspect Andro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: andro-api-35
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: ${{ steps.avd-cache.outputs.cache-hit == 'true' && '-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' || '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none' }}
          script: sh smoke-test.sh "${{ steps.apk.outputs.path }}"

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          RESULTS="smoke-test-results"
          mkdir -p "$RESULTS"

          echo "Capturing emulator state..."

          adb devices -l \
            > "$RESULTS/adb-devices.txt" 2>&1

          timeout 30s adb logcat -d -t 5000 \
            > "$RESULTS/logcat.txt" 2>&1

          timeout 20s adb shell dumpsys activity activities \
            > "$RESULTS/activities.txt" 2>&1

          timeout 20s adb shell dumpsys window windows \
            > "$RESULTS/windows.txt" 2>&1

          timeout 20s adb shell getprop \
            > "$RESULTS/device-properties.txt" 2>&1

          timeout 20s adb shell pidof com.twinpower.andro \
            > "$RESULTS/process-id.txt" 2>&1

          timeout 20s adb exec-out screencap -p \
            > "$RESULTS/andro-screen.png" 2>/dev/null

          adb pull /sdcard/andro-auth-screen.xml \
            "$RESULTS/auth-screen.xml" \
            > /dev/null 2>&1

          emulator -list-avds \
            > "$RESULTS/available-avds.txt" 2>&1

          ps aux | grep -E '[e]mulator|[q]emu' \
            > "$RESULTS/emulator-processes.txt"

          ls -l /dev/kvm \
            > "$RESULTS/kvm-status.txt" 2>&1

          echo "Emulator diagnostic capture completed."

      - name: Analyse emulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          RESULTS="smoke-test-results"
          mkdir -p "$RESULTS"

          REPORT="$RESULTS/diagnostics-summary.md"
          CRASHES="$RESULTS/crash-signatures.txt"

          STATUS="PASS"
          FINDINGS=0

          {
            echo "# Andro emulator diagnostics"
            echo
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo
            echo "## Automated checks"
          } > "$REPORT"

          record_check() {
            LABEL="$1"
            FILE="$2"
            PATTERN="$3"

            if [ -s "$FILE" ] && grep -Fq "$PATTERN" "$FILE"; then
              echo "- PASS — $LABEL" >> "$REPORT"
            else
              echo "- WARNING — $LABEL (missing or not verified)" >> "$REPORT"
              STATUS="WARNING"
              FINDINGS=$((FINDINGS + 1))
            fi
          }

          record_check \
            "Emulator ADB device detected" \
            "$RESULTS/adb-devices.txt" \
            "device"

          record_check \
            "Andro process recorded" \
            "$RESULTS/process-id.txt" \
            ""

          if [ -s "$RESULTS/activities.txt" ] &&
             grep -Fq 'AuthGateActivity' "$RESULTS/activities.txt"; then
            echo "- PASS — Andro launcher activity observed" >> "$REPORT"
          else
            echo "- WARNING — Andro launcher activity not verified" >> "$REPORT"
            STATUS="WARNING"
            FINDINGS=$((FINDINGS + 1))
          fi

          record_check \
            "Andro UI hierarchy captured" \
            "$RESULTS/auth-screen.xml" \
            "ANDRO"

          record_check \
            "Emulator screenshot captured" \
            "$RESULTS/andro-screen.png" \
            ""

          record_check \
            "KVM status recorded" \
            "$RESULTS/kvm-status.txt" \
            "/dev/kvm"

          echo >> "$REPORT"
          echo "## Application crash and ANR scan" >> "$REPORT"

          : > "$CRASHES"

          if [ -s "$RESULTS/logcat.txt" ]; then

            grep -nEi -B 8 -A 12 \
              'FATAL EXCEPTION|Fatal signal|ANR in' \
              "$RESULTS/logcat.txt" |
              grep -Ei \
              'FATAL EXCEPTION|Fatal signal|ANR in|Process: com\.twinpower\.andro|>>> com\.twinpower\.andro <<<' \
              > "$CRASHES"

            if [ -s "$CRASHES" ]; then
              echo "- WARNING — Potential Andro crash or ANR signatures detected." >> "$REPORT"
              echo >> "$REPORT"
              echo '```text' >> "$REPORT"
              head -n 60 "$CRASHES" >> "$REPORT"
              echo '```' >> "$REPORT"

              STATUS="WARNING"
              FINDINGS=$((FINDINGS + 1))
            else
              echo "- PASS — No matching Andro crash or ANR signatures detected in captured logcat." >> "$REPORT"
            fi

          else
            echo "- WARNING — Logcat unavailable; crash scan could not run." >> "$REPORT"
            STATUS="WARNING"
            FINDINGS=$((FINDINGS + 1))
          fi

          {
            echo
            echo "## Result"
            echo
            echo "**$STATUS** — $FINDINGS diagnostic warning(s)."
            echo
            echo "This report analyses captured emulator evidence."
            echo "A missing diagnostic file does not automatically mean the application crashed."
            echo "A clean scan means no matching Andro crash signature was found in the captured logcat window."
            echo
            echo "The GitHub sign-in button was not activated."
          } >> "$REPORT"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Diagnostic analysis written to $REPORT"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-emulator-diagnostics
          path: smoke-test-results/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Versioned GitHub Release
    needs:
      - build
      - apk-smoke-test

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-apks

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Andro v${{ needs.build.outputs.version_name }}
          generate_release_notes: true
          files: |
            release-apks/debug/app-debug.apk
            release-apks/release/app-release-unsigned.apk
          body: |
            ## Andro v${{ needs.build.outputs.version_name }}

            Version code: ${{ needs.build.outputs.version_code }}

            Automated checks completed:
            - Unit tests
            - Android lint
            - Debug APK build
            - Release APK build
            - APK archive validation
            - Android emulator installation
            - Exported launcher activity verification
            - Unauthenticated sign-in screen inspection

            Note: The release APK is unsigned.
            The debug APK is signed with the Android debug key
            and is intended for testing.
