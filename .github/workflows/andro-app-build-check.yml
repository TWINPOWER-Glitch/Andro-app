name: Andro Android CI, APK Tests and Releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/andro-app-build-check.yml"

  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/andro-app-build-check.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andro-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 50

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=andro-apks-v$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Andro version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="v${{ steps.version.outputs.version_name }}"
          ACTUAL="${GITHUB_REF_NAME}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Tag $ACTUAL does not match app version $EXPECTED"
            exit 1
          fi

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Validate APK outputs
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$DEBUG_APK" > debug-badging.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$RELEASE_APK" > release-badging.txt

          head -n 5 debug-badging.txt
          head -n 5 release-badging.txt

          echo "Both APK archives passed validation."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  apk-smoke-test:
    name: Install, Launch and Inspect Andro UI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: apks

      - name: Locate debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find apks -name "app-debug.apk" -print -quit)

          test -n "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Using APK: $APK"

      - name: Prepare emulator smoke-test script
        shell: bash
        run: |
          set -euo pipefail

          cat > smoke-test.sh <<'SMOKE_TEST'
          #!/bin/sh

          set -eu

          APK_PATH="${1:?Debug APK path was not supplied}"

          mkdir -p smoke-test-results

          capture_diagnostics() {
            echo "Capturing emulator diagnostics..."

            adb logcat -d -t 5000 \
              > smoke-test-results/logcat.txt 2>&1 || true

            adb shell dumpsys activity activities \
              > smoke-test-results/activities.txt 2>&1 || true

            adb shell screencap -p /sdcard/andro-smoke.png \
              > /dev/null 2>&1 || true

            adb pull /sdcard/andro-smoke.png \
              smoke-test-results/andro-screen.png \
              > /dev/null 2>&1 || true

            echo "Diagnostics capture finished."
          }

          trap capture_diagnostics EXIT

          echo "Waiting for Android emulator..."

          adb wait-for-device

          BOOTED=""
          ATTEMPT=0

          while [ "$ATTEMPT" -lt 60 ]; do
            BOOTED="$(adb shell getprop sys.boot_completed | tr -d '\r' || true)"

            if [ "$BOOTED" = "1" ]; then
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          if [ "$BOOTED" != "1" ]; then
            echo "Android emulator did not finish booting."
            exit 1
          fi

          echo "Emulator boot completed."

          if [ ! -s "$APK_PATH" ]; then
            echo "Debug APK does not exist: $APK_PATH"
            exit 1
          fi

          echo "Installing Andro APK..."

          adb install -r "$APK_PATH"

          echo "Stopping any previous Andro process..."

          adb shell am force-stop com.twinpower.andro

          echo "Launching Andro MainActivity..."

          adb shell am start -W \
            -n com.twinpower.andro/.MainActivity

          sleep 10

          echo "Checking that the Andro process is alive..."

          if ! adb shell pidof com.twinpower.andro \
            > smoke-test-results/process-id.txt 2>&1; then
            echo "Andro process was not found after launch."
            exit 1
          fi

          PID="$(tr -d '\r\n' < smoke-test-results/process-id.txt)"

          if [ -z "$PID" ]; then
            echo "Andro process is not running."
            exit 1
          fi

          echo "Andro process is running: $PID"

          echo "Inspecting initial Workspace UI..."

          adb shell uiautomator dump \
            /sdcard/andro-workspace.xml

          adb pull /sdcard/andro-workspace.xml \
            smoke-test-results/workspace-ui.xml

          if ! grep -F 'ANDRO' smoke-test-results/workspace-ui.xml; then
            echo "Andro title was not found in the rendered UI."
            exit 1
          fi

          if ! grep -F 'LOCAL WORKSPACE' smoke-test-results/workspace-ui.xml; then
            echo "Workspace interface was not found."
            exit 1
          fi

          echo "Workspace UI verified."

          echo "Locating Connections navigation item..."

          TAB_LINE="$(grep -F 'text="Connections"' \
            smoke-test-results/workspace-ui.xml | head -n 1 || true)"

          TAB_BOUNDS="$(printf '%s\n' "$TAB_LINE" | sed -n \
            's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p')"

          if [ -z "$TAB_BOUNDS" ]; then
            echo "Connections navigation item was not found."
            exit 1
          fi

          set -- $TAB_BOUNDS

          X1="$1"
          Y1="$2"
          X2="$3"
          Y2="$4"

          TAB_X=$(( (X1 + X2) / 2 ))
          TAB_Y=$(( (Y1 + Y2) / 2 ))

          adb shell input tap "$TAB_X" "$TAB_Y"

          sleep 3

          echo "Inspecting Connections screen..."

          FOUND_REMOTE_BUILDS=""
          ATTEMPT=0

          while [ "$ATTEMPT" -lt 20 ]; do
            adb shell uiautomator dump \
              /sdcard/andro-connections.xml \
              > /dev/null

            adb pull /sdcard/andro-connections.xml \
              smoke-test-results/connections-ui.xml \
              > /dev/null

            if grep -F 'GITHUB PROJECT SYNC' \
              smoke-test-results/connections-ui.xml; then
              FOUND_REMOTE_BUILDS="yes"
              break
            fi

            adb shell input swipe 540 1600 540 450 350
            sleep 1

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$FOUND_REMOTE_BUILDS" != "yes" ]; then
            echo "GitHub Project Sync UI was not found on Connections screen."
            exit 1
          fi

          if ! grep -F 'Push project and start remote build' \
            smoke-test-results/connections-ui.xml; then
            echo "Remote build action was not found in the UI."
            exit 1
          fi

          echo "GitHub Remote Builds UI verified."

          echo "Checking foreground activity..."

          adb shell dumpsys activity activities \
            > smoke-test-results/activities.txt

          if ! grep -E 'mResumedActivity|topResumedActivity' \
            smoke-test-results/activities.txt \
            | grep -F 'com.twinpower.andro'; then
            echo "Andro is not the resumed foreground activity."
            exit 1
          fi

          echo "Andro installation, launch and UI smoke tests passed."
          SMOKE_TEST

          chmod +x smoke-test.sh

          test -s smoke-test.sh

          echo "Emulator smoke-test script prepared."

      - name: Install, launch and inspect Andro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: sh smoke-test.sh "${{ steps.apk.outputs.path }}"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andro-emulator-diagnostics
          path: smoke-test-results/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Versioned GitHub Release
    needs:
      - build
      - apk-smoke-test

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-apks

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Andro v${{ needs.build.outputs.version_name }}
          generate_release_notes: true
          files: |
            release-apks/debug/app-debug.apk
            release-apks/release/app-release-unsigned.apk
          body: |
            ## Andro v${{ needs.build.outputs.version_name }}

            Version code: ${{ needs.build.outputs.version_code }}

            Automated checks completed:
            - Unit tests
            - Android lint
            - Debug APK build
            - Release APK build
            - APK archive validation
            - Android emulator installation
            - Android app launch
            - Workspace UI inspection
            - Connections and Remote Builds UI inspection

            Note: The release APK is unsigned. The debug APK is signed
            with the Android debug key and is intended for testing.
